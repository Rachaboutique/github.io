<!DOCTYPE html>
<!-- تحديد لغة الصفحة العربية والتوجيه من اليمين إلى اليسار -->
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"> <!-- لدعم الحروف العربية بشكل صحيح دون تشويه -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- لجعل التصميم متناسقاً مع شاشات الهواتف والكمبيوتر -->
    <title>Racha Boutique 💤</title> <!-- اسم الموقع الذي يظهر في علامة تبويب المتصفح -->
    
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #fff6f8; 
            color: #333; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
        }

        /* الشريط الوردي الثابت المطور والزجاجي */
        .top-navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 105px; 
            background-color: rgba(255, 214, 226, 0.70); 
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px); 
            z-index: 9999; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 0 30px; 
            box-shadow: 0 4px 20px rgba(214, 51, 132, 0.08); 
        }

        /* اللوغو الدائري المثبت في جهة اليسار */
        .store-logo { 
            width: 105px !important;    
            height: 105px !important;   
            object-fit: cover !important; 
            border-radius: 50% !important; 
            margin: 0 !important;      
            padding: 0 !important;     
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); 
            order: 2; 
        }

        /* حاوية السلة والنص الإرشادي باليمين */
        .cart-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            order: 1; 
        }

        /* بوكس أيقونة السلة الذكية */
        .cart-status-box {
            display: flex;
            align-items: center;
            background: white;
            padding: 8px 15px;
            border-radius: 30px;
            border: 2px solid #d63384;
            font-weight: bold;
            color: #d63384;
            box-shadow: 0 2px 8px rgba(214, 51, 132, 0.1);
        }

        .cart-icon {
            font-size: 20px;
            margin-left: 8px;
        }

        /* عداد السلة الوردي الدائري */
        .cart-count {
            background-color: #d63384;
            color: white;
            border-radius: 50%;
            padding: 2px 8px;
            font-size: 14px;
            margin-right: 5px;
            font-weight: bold;
        }

        /* تنسيق نص عرض مشترياتي تحت السلة المربوط بالصفحة الجديدة */
        .view-my-purchases {
            font-size: 12px;
            color: #b02263;
            font-weight: bold;
            text-decoration: underline;
            cursor: pointer;
            transition: 0.2s;
        }
        .view-my-purchases:hover {
            color: #d63384;
        }

        /* شريط الكتابة المتحركة المستمرة تحت الشريط الوردي */
        .moving-text-bar {
            position: fixed;
            top: 105px; 
            left: 0;
            right: 0;
            background-color: #d63384; 
            color: white; 
            font-weight: bold;
            font-size: 14px;
            padding: 6px 0;
            z-index: 9998; 
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        /* مسافة أمان علوية لتعويض مساحة الأشرطة الثابتة ومنع التداخل */
        .main-content {
            margin-top: 170px; 
        }

        .s.store-title { 
    font-size: 42px; 
    font-weight: 900; 
    color: #d63384; 
    margin-top: 10px; 
    margin-bottom: 5px; 
    text-shadow: 2px 2px 4px rgba(214, 51, 132, 0.2); 
    display: inline-block; 
    animation: pulseGlow 3s infinite ease-in-out; 
    /* 👈 هذه الأسطر الجديدة تجعل الاسم يمر فوق الشريط الضبابي دائماً */
    position: relative !important;
    z-index: 10001 !important; /* رفعه لطبقة أعلى من الشريط الوردي */
}

        
        /* زر طلب عبر واتساب الفوري */
        .btn { background-color: #d63384; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; transition: 0.3s; text-decoration: none; display: inline-block; box-sizing: border-box; margin-bottom: 8px; }
        .btn:hover { background-color: #b02263; }
        
        /* زر إضافة إلى السلة الوردي الأنيق */
        .btn-add-cart { background-color: transparent; color: #d63384; border: 2px solid #d63384; padding: 10px 20px; font-size: 15px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; transition: 0.3s; box-sizing: border-box; display: inline-block; text-decoration: none; }
        .btn-add-cart:hover { background-color: #d63384; color: white; }

        /* الحاوية الطولية للحفاظ على الشكل الدائري القديم للأزرار وتحت بعضها */
        .social-sidebar-old {
            position: fixed;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 12px; 
            z-index: 1000;
        }

        /* التنسيق الأساسي المطابق تماماً لزر الفيسبوك القديم الخاص بكِ */
        .old-float-btn {
            display: inline-block;
            text-decoration: none;
            padding: 12px 18px;
            border-radius: 30px; 
            font-weight: bold;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: 0.3s;
            text-align: center;
        }

        .old-float-btn:hover {
            transform: scale(1.05); 
        }

        /* الألوان الرسمية لكل زر */
        .bg-fb { background-color: #1877f2; }
        .bg-ig { background-color: #e1306c; }
        .bg-tg { background-color: #0088cc; }
        .bg-wa { background-color: #25d366; }

        /* تنسيق المربعات التحفيزية والمميزات */
        .features-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin: -10px auto 35px auto;
            max-width: 700px;
            padding: 0 10px;
        }

        .feature-box {
            background-color: #fff1f5; 
            border: 1px dashed #d63384; 
            border-radius: 30px; 
            padding: 8px 18px;
            font-size: 14px;
            font-weight: bold;
            color: #b02263; 
            box-shadow: 0 2px 8px rgba(214, 51, 132, 0.05);
        }

        /* كود التجاوب التلقائي المخصص لشاشات الهواتف المحمولة */
        @media (max-width: 768px) {
            .top-navbar {
                height: 80px !important;
                padding: 0 15px !important;
            }
            .store-logo {
                width: 80px !important;
                height: 80px !important;
            }
            .moving-text-bar {
                top: 80px !important;
            }
            .main-content {
                margin-top: 140px !important;
                padding: 10px !important;
            }
            .store-title {
                font-size: 30px !important;
            }
            .container {
                grid-template-columns: repeat(1, minmax(0, 300px)) !important;
                gap: 20px !important;
            }
            .features-container {
                gap: 10px;
                margin-bottom: 25px;
            }
            .feature-box {
                font-size: 12px;
                padding: 6px 14px;
            }
            /* ضبط مظهر أزرار التواصل لتصبح أيقونات دائرية صغيرة جداً في أسفل الهاتف */
            .social-sidebar-old {
                top: auto !important;
                bottom: 10px !important; 
                right: 0 !important;
                left: 0 !important;
                transform: none !important;
                flex-direction: row !important; 
                justify-content: center !important;
                gap: 15px !important; 
                padding: 0 10px !important;
            }
            .old-float-btn {
                width: 45px !important; 
                height: 45px !important; 
                padding: 0 !important; 
                font-size: 20px !important; 
                border-radius: 50% !important; 
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                flex: none !important; 
            }
            .old-float-btn span {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <!-- العدادات البرمجية لتصفير العداد قبل تشغيله تراكمياً -->
    <script>
        window.cartCount = 0;
        window.cartTotal = 0;
    </script>

    <!-- الشريط الوردي العلوي الثابت مع السلة والنص المطلوب -->
    <div class="top-navbar">
        <img src="logo.jpg.jpg" alt="لوغو المتجر" class="store-logo">
        
        <div class="cart-wrapper">
            <div class="cart-status-box">
                <span class="cart-icon">🛒</span>
                <span>السلة: </span>
                <span class="cart-count" id="globalCartCount">0</span>
                <span style="margin-right: 8px;">| المجموع: </span>
                <span id="globalCartTotal">0</span><span> دج</span>
