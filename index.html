<!DOCTYPE html>
<!-- تحديد لغة الصفحة العربية والتوجيه من اليمين إلى اليسار -->
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"> <!-- لدعم الحروف العربية بشكل صحيح دون تشويه -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- لجعل التصميم متناسقاً مع شاشات الهواتف والكمبيوتر -->
    <title>Racha Boutique 💤</title> <!-- اسم الموقع الذي يظهر في علامة تبويب المتصفح -->
    <link rel="icon" type="image/jpeg" href="logo.jpg.jpg">
    
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #fff6f8; 
            color: #333; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
        }

        /* الشريط الوردي الثابت المطور والزجاجي */
        .top-navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 105px; 
            background-color: rgba(255, 214, 226, 0.70); 
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px); 
            z-index: 9999; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 0 30px; 
            box-shadow: 0 4px 20px rgba(214, 51, 132, 0.08); 
        }

        /* اللوغو الدائري المثبت في جهة اليسار */
        .store-logo { 
            width: 105px !important;    
            height: 105px !important;   
            object-fit: cover !important; 
            border-radius: 50% !important; 
            margin: 0 !important;      
            padding: 0 !important;     
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); 
            order: 2; 
        }

        /* حاوية السلة والنص الإرشادي باليمين */
        .cart-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            order: 1; 
        }

        /* بوكس أيقونة السلة الذكية */
        .cart-status-box {
            display: flex;
            align-items: center;
            background: white;
            padding: 8px 15px;
            border-radius: 30px;
            border: 2px solid #d63384;
            font-weight: bold;
            color: #d63384;
            box-shadow: 0 2px 8px rgba(214, 51, 132, 0.1);
        }

        .cart-icon {
            font-size: 20px;
            margin-left: 8px;
        }

        /* عداد السلة الوردي الدائري */
        .cart-count {
            background-color: #d63384;
            color: white;
            border-radius: 50%;
            padding: 2px 8px;
            font-size: 14px;
            margin-right: 5px;
            font-weight: bold;
        }

        /* تنسيق نص عرض مشترياتي تحت السلة المربوط بالصفحة الجديدة */
        .view-my-purchases {
            font-size: 12px;
            color: #b02263;
            font-weight: bold;
            text-decoration: underline;
            cursor: pointer;
            transition: 0.2s;
        }
        .view-my-purchases:hover {
            color: #d63384;
        }

        /* تنسيق زر انضمي إلينا العائم أسفل الشريط من الجهة اليمنى */
        .btn-join-team-float {
            position: fixed;
            top: 155px; 
            right: 20px; 
            background-color: #d63384;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 14px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(214, 51, 132, 0.25);
            transition: 0.3s ease-in-out;
            z-index: 9997; 
        }
        .btn-join-team-float:hover {
            background-color: #b02263;
            transform: scale(1.05);
        }

        /* شريط الكتابة المتحركة المستمرة تحت الشريط الوردي */
        .moving-text-bar {
            position: fixed;
            top: 105px; 
            left: 0;
            right: 0;
            background-color: #d63384; 
            color: white; 
            font-weight: bold;
            font-size: 14px;
            padding: 6px 0;
            z-index: 9998; 
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        /* مسافة أمان علوية لتعويض مساحة الأشرطة الثابتة ومنع التداخل */
        .main-content {
            margin-top: 210px; 
        }

        .store-title { font-size: 42px; font-weight: 900; color: #d63384; margin-top: 10px; margin-bottom: 5px; text-shadow: 2px 2px 4px rgba(214, 51, 132, 0.2); display: inline-block; animation: pulseGlow 3s infinite ease-in-out; }
        @keyframes pulseGlow { 0% { transform: scale(1); } 50% { transform: scale(1.05); color: #b02263; } 100% { transform: scale(1); } }
        .subtitle { color: #6c757d; font-size: 16px; margin-bottom: 40px; }
        
        /* تنسيق شبكة المنتجات لتعرض قطعتين بجانب بعضهما بانتظام */
        .container { 
            display: grid !important; 
            grid-template-columns: repeat(2, minmax(0, 300px)) !important; 
            justify-content: center !important; 
            gap: 30px !important; 
            max-width: 700px;
            margin: 0 auto;
        }

        .card { background: white; border: 1px solid #ffe3ec; border-radius: 16px; width: 100%; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: 0.3s; box-sizing: border-box; }
        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; border-radius: 12px; height: 380px; object-fit: cover; }
        .card h3 { font-size: 19px; margin: 15px 0 5px 0; color: #2d3748; }
        .price { color: #d63384; font-weight: bold; font-size: 22px; margin: 10px 0; }
        
        /* زر طلب عبر واتساب الفوري */
        .btn { background-color: #d63384; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; transition: 0.3s; text-decoration: none; display: inline-block; box-sizing: border-box; margin-bottom: 8px; text-align: center; }
        .btn:hover { background-color: #b02263; }
        
        /* زر إضافة إلى السلة الوردي الأنيق */
        .btn-add-cart { background-color: transparent; color: #d63384; border: 2px solid #d63384; padding: 10px 20px; font-size: 15px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; transition: 0.3s; box-sizing: border-box; display: inline-block; text-decoration: none; }
        .btn-add-cart:hover { background-color: #d63384; color: white; }

        .fb-float-btn { position: fixed; top: 50%; right: 20px; transform: translateY(-50%); background-color: #1877f2; color: white; text-decoration: none; padding: 12px 18px; border-radius: 30px; font-weight: bold; z-index: 1000; }

        /* فقاعة الإرشاد اللطيفة */
        .guide-bubble {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background-color: #ffffff;
            border: 2px solid #d63384;
            border-radius: 16px;
            padding: 15px;
            width: 260px;
            box-shadow: 0 10px 25px rgba(214, 51, 132, 0.15);
            z-index: 10000; 
            text-align: right;
            animation: bounceIn 1s ease-out;
        }

        .guide-bubble p {
            margin: 0 0 12px 0;
            font-size: 14px;
            color: #333;
            line-height: 1.5;
            font-weight: 500;
        }

        .guide-btn {
            background-color: #d63384;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 13px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s ease;
            width: 100%; 
            text-align: center;
        }

        .guide-btn:hover {
            background-color: #b02263;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); opacity: 0.8; }
            70% { transform: scale(0.9); opacity: 0.9; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* كود التجاوب التلقائي المخصص لشاشات الهواتف المحمولة */
        @media (max-width: 768px) {
            .top-navbar {
                height: 80px !important;
                padding: 0 15px !important;
            }
            .store-logo {
                width: 80px !important;
                height: 80px !important;
            }
            .moving-text-bar {
                top: 80px !important;
            }
            .btn-join-team-float {
                top: 125px !important;
                right: 15px !important;
                padding: 8px 15px !important;
                font-size: 12px !important;
            }
            .main-content {
                margin-top: 180px !important;
                padding: 10px !important;
            }
            .store-title {
                font-size: 30px !important;
            }

            .container {
                grid-template-columns: repeat(2, minmax(0, 165px)) !important;
                gap: 15px !important;
                max-width: 100%;

            .card img {
                height: 210px !important; /* تقصير طول الصور ليناسب الهاتف الصغير */

            .card h3 {

                margin: 8px 0 3px 0 !important;
            }
            .price {
                font-size: 15px !important;
                margin: 5px 0 !important;
            }
            .btn {
                padding: 8px 10px !important;
                font-size: 12px !important;
            }
            .btn-add-cart {
                padding: 6px 10px !important;
                font-size: 11px !important;
            }
